<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7a1416"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ADC حسابات"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" crossorigin="anonymous"></script><script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js" crossorigin="anonymous"><\/script>')</script></head><body>
<title>ADC حسابات المواقع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;700&display=swap">
<style>
/* Layout: RTL site ledger — site rail (chips on phone) + ledger pane with summary, breakdowns, entry form, table */
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --sunk:#E4E7E2; --line:#D3D8D1;
  --fg:#1B2328; --muted:#5E6A70; --accent:#1D5C86; --accent-soft:#DCE8F1; --on-accent:#FFFFFF;
  --money:#9A5B0B; --danger:#B3261E; --danger-soft:#F7E1DF; --ok:#2E7D4F;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121719; --surface:#1A2124; --sunk:#232B2F; --line:#2F393E;
  --fg:#E6EAEC; --muted:#98A5AB; --accent:#6FB0DC; --accent-soft:#1D3342; --on-accent:#0D1A22;
  --money:#E3A94F; --danger:#F08A80; --danger-soft:#3A1F1D; --ok:#6CC495; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121719; --surface:#1A2124; --sunk:#232B2F; --line:#2F393E;
  --fg:#E6EAEC; --muted:#98A5AB; --accent:#6FB0DC; --accent-soft:#1D3342; --on-accent:#0D1A22;
  --money:#E3A94F; --danger:#F08A80; --danger-soft:#3A1F1D; --ok:#6CC495; color-scheme:dark}
*{box-sizing:border-box}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;direction:rtl;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:1180px;margin:0 auto}
header.top{display:flex;align-items:center;gap:14px;padding-block:18px 14px;border-bottom:2px solid var(--fg);margin-bottom:18px;flex-wrap:wrap}
.logo{display:inline-flex;line-height:0}
.logo img{height:52px;width:auto;display:block}
@media (max-width:560px){.logo img{height:42px}}
header h1{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0}
header .sub{color:var(--muted);font-size:13px;margin-inline-start:auto}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}
.rail{display:flex;flex-direction:column;gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:820px){.rail{position:static}}
.rail h2,.sec-h{font-family:var(--f-display);font-weight:500;font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0 0 4px}
.sites{display:flex;flex-direction:column;gap:4px}
@media (max-width:820px){.sites{flex-direction:row;overflow-x:auto;padding-bottom:4px}}
.site-btn{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 12px;border-radius:8px;border:1px solid transparent;white-space:nowrap}
.site-btn:hover{background:var(--sunk)}
.site-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.site-btn[aria-current="true"]{background:var(--surface);border-color:var(--line);box-shadow:inset -3px 0 0 var(--accent)}
.site-btn .n{font-weight:600}
.site-btn .t{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.newsite{display:flex;gap:6px;margin-top:8px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;white-space:nowrap}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
button.ghost:hover{color:var(--fg);background:var(--sunk)}
button.danger{background:var(--danger);border-color:var(--danger);color:var(--surface)}
button:disabled{opacity:.5;cursor:default}
.pane{display:flex;flex-direction:column;gap:18px;min-width:0}
.pane-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pane-h h2{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;text-wrap:balance}
.pane-h .actions{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:560px){.stats{grid-template-columns:minmax(0,1fr)}}
.stat{background:var(--surface);padding:14px 16px}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;color:var(--money)}
.stat .v small{font-size:13px;font-weight:500;color:var(--muted);margin-inline-start:4px}
.stat .v.plain{color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.breakdowns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:640px){.breakdowns{grid-template-columns:minmax(0,1fr)}}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:8px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;font-size:14px}
.bar-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .am{font-variant-numeric:tabular-nums;font-weight:600}
.bar-row .track{grid-column:1/-1;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--accent);border-radius:3px}
.empty-note{color:var(--muted);font-size:14px;margin:6px 0 0}
form.entry{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end}
form.entry .f{display:flex;flex-direction:column;gap:4px;min-width:0}
form.entry label{font-size:12px;color:var(--muted);font-weight:500}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c1{grid-column:span 1}
@media (max-width:760px){form.entry{grid-template-columns:repeat(2,minmax(0,1fr))}.c1,.c2,.c3{grid-column:span 2}.half{grid-column:span 1}}
.form-foot{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg{font-size:13px;color:var(--muted)}
.msg.err{color:var(--danger)}.msg.ok{color:var(--ok)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.filters .f{display:flex;flex-direction:column;gap:3px;flex:1 1 150px;min-width:0}
.filters label{font-size:12px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-display);font-weight:500;font-size:12px;color:var(--muted);background:var(--sunk);position:sticky;top:0}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
td.num{font-weight:600;color:var(--money)}
td.date{font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr;text-align:end}
td .note{display:block;color:var(--muted);font-size:12px}
tr:last-child td{border-bottom:0}
tfoot td{background:var(--sunk);font-weight:600;border-top:2px solid var(--line)}
.chip{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.banner{padding:10px 14px;border-radius:8px;background:var(--danger-soft);color:var(--danger);font-size:14px}
.blank{text-align:center;padding:48px 16px;color:var(--muted)}
.blank h3{font-family:var(--f-display);color:var(--fg);font-weight:500;margin:0 0 6px}
.overview td.nm{font-weight:600}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 11px;margin-inline-start:auto}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.live .dot{background:var(--ok)}
.status.off .dot{background:var(--money)}
.pend{display:inline-block;font-size:11px;color:var(--money);border:1px solid currentColor;border-radius:999px;padding:0 7px;margin-inline-start:6px;white-space:nowrap}
.backup{display:flex;flex-direction:column;gap:10px}
.backup p{margin:0;color:var(--muted);font-size:14px;max-width:65ch}
.backup .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filebtn{position:relative;overflow:hidden;display:inline-block}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.site-cards{display:none;flex-direction:column;gap:10px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.scard.neg-card{background:var(--danger-soft);border-color:var(--danger)}
.sc-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.scard dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.scard dl div{display:flex;justify-content:space-between;gap:6px;font-size:13px}
.scard dt{color:var(--muted)}
.scard dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.scard dd.in{color:var(--ok)}.scard dd.out{color:var(--money)}.scard dd.neg{color:var(--danger)}
.scard .tot{grid-column:1/-1;border-top:1px solid var(--line);padding-top:6px;font-size:15px}
@media (max-width:640px){.site-cards{display:flex}.tbl-wrap.overview{display:none}}
.pill-over,.pill-none{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill-over{background:var(--money);color:var(--surface)}
.pill-none{background:var(--sunk);color:var(--muted);font-weight:500}
.alert.over{background:var(--sunk);color:var(--money)}
.scard.over-card{border-color:var(--money)}
tr.row-over td{background:var(--sunk)}
span.neg{color:var(--danger);font-weight:700}
span.pos{color:var(--money);font-weight:700}
.muted{color:var(--muted)}
.date-i{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.recon{display:flex;flex-direction:column;gap:12px}
.recon.st-short{border-color:var(--danger);box-shadow:inset -4px 0 0 var(--danger)}
.recon.st-over{border-color:var(--money)}
.rc-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rc-h .sec-h{margin:0}
.rc-sub{margin:0;color:var(--muted);font-size:14px;max-width:70ch}
.rc-msg{margin:0;font-size:14px;font-weight:500}
.rc-msg.neg{color:var(--danger)}.rc-msg.pos{color:var(--money)}.rc-msg.okc{color:var(--ok)}
table.rc-t{min-width:0}
.rc-hist summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:500}
.rc-hist table{min-width:560px;margin-top:8px}
.rc-del{display:flex;justify-content:flex-end}
.foot-note{margin:-6px 0 0;color:var(--muted);font-size:13px}
.xbar{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--accent-soft);color:var(--fg);font-size:14px}
.xbar.ok{background:var(--sunk);color:var(--ok);justify-content:flex-start}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--fg);cursor:pointer}
.chk input{width:auto;margin-top:4px}
table.log-t{min-width:640px}
.acts{white-space:nowrap}
.acts .ghost{padding:4px 7px}
tr.row-edit td{background:var(--accent-soft)}
.entry-card.editing{border-color:var(--accent);box-shadow:inset -4px 0 0 var(--accent)}
.edit-h{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.edit-h b{font-family:var(--f-display);font-weight:500;font-size:16px;color:var(--accent)}
.rcpt{all:unset;cursor:pointer;display:inline-block;margin-top:3px;font-size:12px;font-weight:600;color:var(--accent);text-decoration:underline}
.rcpt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ok-note{color:var(--ok)!important}
.chk.sm{font-size:13px;color:var(--muted);margin-top:4px}
.viewer{position:fixed;inset:0;background:rgba(10,14,16,.72);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);z-index:50}
.vbox{background:var(--surface);border-radius:12px;max-width:min(900px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.vbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.vbox img{max-width:100%;max-height:calc(100vh - 140px);object-fit:contain;display:block;margin:auto}
.vbox .note,.vbox .primary-link{margin:16px}
.primary-link{color:var(--accent);font-weight:600}
.site-btn.jbtn{border:1px dashed var(--line);margin-bottom:6px}
.site-btn.jbtn .n{color:var(--accent)}
table.j-t{min-width:1180px}
.j-card{border-color:var(--accent)}
.layout.wide{grid-template-columns:minmax(0,1fr)}
.layout.wide .rail{position:static}
.layout.wide .sites{flex-direction:row;flex-wrap:wrap}
.layout.wide .newsite{max-width:420px}
.layout.wide .site-btn.jbtn{margin-bottom:0}
table.j-t td{white-space:normal}
table.j-t td.date,table.j-t td.num,table.j-t td.acts{white-space:nowrap}
.chip{white-space:nowrap}
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 8vh) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
body.is-locked .wrap{display:none}
.lock[hidden],.viewer[hidden]{display:none}
.lk-box{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 22px;display:flex;flex-direction:column;gap:10px}
.lk-logo{height:56px;width:auto;align-self:flex-start;margin-bottom:6px}
.lk-box h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0}
.lk-sub{margin:0;color:var(--muted);font-size:14px}
.lk-form{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.lk-form label{font-size:13px;color:var(--muted);font-weight:500}
.lk-form button{margin-top:4px}
.lk-err{margin:0;color:var(--danger);font-size:14px;font-weight:500}
.lk-warn{margin:6px 0 0;color:var(--money);font-size:13px}
.pin-in{font-size:24px;letter-spacing:.4em;text-align:center;direction:ltr}
#secCard .row label{font-size:13px;color:var(--muted)}
#secCard select{width:auto}
.pw-form{margin-top:4px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
table.users-t{min-width:480px}
.fs-row{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.fs-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.fs-l .note{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.lk-info{margin:0;padding:8px 10px;border-radius:8px;background:var(--accent-soft);color:var(--fg);font-size:13px}
.reg-new{margin-top:6px}
.ghost.back{padding:2px 0;margin-bottom:4px;color:var(--accent);font-weight:600}
.qs .row{display:flex;gap:8px;flex-wrap:wrap}.qs select{flex:1 1 220px;width:auto}
.chip-btn{border:0;cursor:pointer;font:inherit;font-size:12px}
.chip-btn:hover,.linkish:hover{text-decoration:underline}
.owner-tag{display:inline-block;margin-inline-start:6px;font-size:11px;font-weight:500;color:var(--muted);background:var(--sunk);border-radius:999px;padding:0 7px}
.imp{display:flex;flex-direction:column;gap:12px;border-color:var(--accent)}
.imp .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.imp-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.imp-map .f{display:flex;flex-direction:column;gap:3px;min-width:0}.imp-map label{font-size:12px;color:var(--muted)}
.imp-sum{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px}
.imp-prev{max-height:420px;overflow:auto}.imp-prev table{min-width:900px}
tr.row-dim td{color:var(--muted)}
.more{grid-column:1/-1;border:1px dashed var(--line);border-radius:10px;padding:0 12px}
.more summary{cursor:pointer;padding:10px 0;color:var(--accent);font-weight:500;font-size:14px}
.more[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}
.more-in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding-bottom:12px}
@media (max-width:760px){.more-in{grid-template-columns:minmax(0,1fr)}.more-in .c2{grid-column:auto}}
.c4{grid-column:span 4}.c5{grid-column:span 5}
@media (max-width:760px){.c4,.c5{grid-column:span 2}}
.hdr-lock{padding:4px 10px;font-size:13px}
.warn{color:var(--money);font-weight:500}
.stat .v.in,td.num.in{color:var(--ok)}
.stat .v.bal{color:var(--fg)}
.stat .v.neg,td.num.neg,b.neg,.t.neg{color:var(--danger)!important}
.stat.deficit{background:var(--danger-soft)}
.split{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.split b{color:var(--fg);font-weight:600}
.pill-neg,.pill-ok{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill-neg{background:var(--danger);color:var(--surface)}
.pill-ok{background:var(--sunk);color:var(--ok)}
.alert{padding:10px 14px;border-radius:8px;background:var(--danger-soft);color:var(--danger);font-size:14px;line-height:1.8}
.linkish{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
.alert .linkish{color:inherit;text-decoration:underline}
.linkish:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
td.num.plain{color:var(--fg);font-weight:500}
td.num.strong{font-weight:700;color:var(--fg)}
tr.row-neg td{background:var(--danger-soft)}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:3px;margin-bottom:12px;flex-wrap:wrap;align-self:flex-start}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:7px;color:var(--muted);font-weight:500}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mtag{display:block;font-size:11px;font-weight:400;color:var(--muted)}
button.in-btn{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@keyframes autoFlash{0%{box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--accent)}100%{box-shadow:none}}
select.auto-flash{animation:autoFlash 1.2s ease-out}
</style>

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;try{if(SEC.locked&&document.getElementById('lock'))appShow();else render()}catch(x){}});
window.addEventListener('appinstalled',()=>{installEvt=null;try{render()}catch(x){}});
async function appInstall(){
  if(installEvt){installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;try{render()}catch(e){}return}

function installHint(){
  if(isStandalone())return '';
  if(installEvt)return `<button type="button" class="ghost" data-app="install">تثبيت التطبيق على الجهاز</button>`;
  if(isIOS())return `<p class="lk-info">لتثبيته على الآيفون: افتح الرابط من Safari، واضغط على زر المشاركة، ثم «إضافة إلى الشاشة الرئيسية».</p>`;

}

/* ---------- auth messages ---------- */
function authErr(e){
  const m=String(e&&(e.message||e.error_description||e.msg)||'');
  if(/invalid login credentials/i.test(m))return 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
  if(/email not confirmed/i.test(m))return 'يجب تأكيد البريد الإلكتروني أولًا: افتح الرسالة التي وصلتك على البريد الإلكتروني واضغط على الرابط الموجود فيها.';
  if(/already registered|already exists/i.test(m))return 'هذا البريد الإلكتروني مسجّل من قبل. سجّل الدخول به، وإذا نسيت كلمة المرور اضغط «نسيت كلمة المرور».';
  if(/rate limit|too many|security purposes/i.test(m))return 'محاولات كثيرة في وقت قصير. انتظر قليلًا وحاول مرة أخرى.';
  if(/password/i.test(m)&&/(least|short|weak|characters)/i.test(m))return 'كلمة المرور ضعيفة. اجعلها ٨ حروف وأرقام على الأقل.';
  if(/invalid.*email|email.*invalid/i.test(m))return 'البريد الإلكتروني مكتوب بشكل غير صحيح.';
  if(/fetch|network|failed to|load failed/i.test(m)||!navigator.onLine)return 'لا يوجد اتصال بالإنترنت. تأكد من الاتصال وحاول مرة أخرى.';
  return 'حدثت مشكلة: '+m;
}
const emailOk=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

function appShow(){
  let el=document.getElementById('lock');
  if(!el){el=document.createElement('div');el.id='lock';el.className='lock';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');document.body.appendChild(el)}
  document.body.classList.add('is-locked');el.hidden=false;SEC.locked=true;el.innerHTML=appLockHTML();
  const sh=document.getElementById('ap_show');if(sh)sh.onchange=()=>el.querySelectorAll('input[type=password],input[data-pw]').forEach(i=>{i.dataset.pw='1';i.type=sh.checked?'text':'password'});
  const f=el.querySelector('input:not([type=checkbox])');if(f&&!f.value)f.focus();else{const p=el.querySelector('#ap_pw');if(p)p.focus()}
}
function appHide(){const el=document.getElementById('lock');if(el){el.hidden=true;el.innerHTML=''}document.body.classList.remove('is-locked');SEC.locked=false;APPU.msg='';APPU.info=''}

let appEnter=null;
async function appResolve(session){
  const u=session.user;const meta=u.user_metadata||{};
  const me={id:u.id,email:u.email||'',name:(meta.name||'').trim()||(u.email||'').split('@')[0]};
  let owner=false,row=null;
  const r1=await SB.rpc('am_owner');if(r1.error)throw r1.error;owner=!!r1.data;
  const r2=await SB.from('members').select('id,email,name,approved').eq('id',u.id).maybeSingle();if(r2.error)throw r2.error;row=r2.data;
  if(!owner&&!row){const r3=await SB.from('members').insert({id:u.id,email:me.email,name:me.name});if(r3.error&&!/duplicate/i.test(r3.error.message||''))throw r3.error;row={approved:false,name:me.name}}
  if(row&&row.name)me.name=row.name;
  APPU.me=me;APPU.owner=owner;APPU.approved=owner||!!(row&&row.approved);
  appLs(LS_ME,{...me,owner,approved:APPU.approved});
  return APPU.approved;
}
const appWithTO=(pr,ms)=>Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej({message:'timeout'}),ms))]);
const appNetErr=e=>!navigator.onLine||/fetch|network|timeout|load failed|offline|ERR_/i.test(String(e&&(e.message||e.name||e)));
const APP_OFF_MSG='لا يوجد اتصال بالإنترنت. يعمل التطبيق على آخر نسخة محفوظة على هذا الجهاز، وستُرفع الحركات التي تسجّلها تلقائيًا عند عودة الاتصال.';
function appEnterOffline(c){
  APPU.me=c;APPU.owner=!!c.owner;APPU.approved=true;APPU.offline=true;
  appHide();showBanner(APP_OFF_MSG);
  if(appEnter){const f=appEnter;appEnter=null;f()}
}
async function appPing(){
  if(!navigator.onLine)return false;
  try{await appWithTO(fetch(APPCFG.url+'/auth/v1/health',{headers:{apikey:APPCFG.key},cache:'no-store'}),5000);return true}catch(e){return false}
}
async function appTryEnter(session){
  try{
    let ok;
    try{ok=await appWithTO(appResolve(session),9000)}
    catch(e){
      const c=appLs(LS_ME);
      if(appNetErr(e)&&c&&c.id===session.user.id&&c.approved){appEnterOffline(c);return true}
      throw e;
    }
    if(!ok){APPU.mode='wait';appShow();return false}
    appHide();if(appEnter){const f=appEnter;appEnter=null;f()}return true;
  }catch(e){APPU.msg=authErr(e);APPU.mode='login';appShow();return false}
}
async function appBoot(){
  const cached=appLs(LS_ME);
  if(!sbClient()){
    if(cached&&cached.approved){APPU.me=cached;APPU.owner=!!cached.owner;APPU.approved=true;APPU.offline=true;await appBioGate();showBanner('لا يوجد اتصال بالإنترنت. أنت تعمل على آخر نسخة محفوظة على الجهاز، وأي شيء تسجّله سيُرفع عند فتح التطبيق مع توفر الإنترنت.');return}
    APPU.mode='nolib';appShow();return new Promise(()=>{});
  }
  SB.auth.onAuthStateChange((ev,ses)=>{
    if(ev==='PASSWORD_RECOVERY'){APPU.mode='newpw';APPU.msg='';appShow()}
    else if(ev==='SIGNED_OUT'&&!SEC.locked){location.reload()}
  });
  let ses=null;
  try{ses=(await appWithTO(SB.auth.getSession(),7000)).data.session}catch(e){}
  const recovery=/type=recovery/.test(location.hash+location.search);
  let hadSes=false;try{hadSes=!!localStorage.getItem('adc-app-auth')}catch(e){}
  if(!ses&&!recovery&&cached&&cached.approved&&hadSes&&!(await appPing())){APPU.me=cached;await appBioGate();appEnterOffline(cached);return}
  if(ses&&!recovery&&cached&&cached.id===ses.user.id){APPU.me=cached;await appBioGate()}
  const wait=new Promise(res=>{appEnter=res});
  if(ses&&!recovery){if(await appTryEnter(ses))return}
  else{APPU.mode=recovery?'newpw':'login';APPU.email=(cached&&cached.email)||'';appShow()}
  return wait;
}
async function appSignOut(){
  if(S.pending.some(p=>p.col!=='log')){try{await flush()}catch(e){}
    if(S.pending.some(p=>p.col!=='log')&&!confirm('توجد تعديلات لم تُرفع بعد لعدم وجود اتصال بالإنترنت. إذا خرجت الآن فستضيع. هل تريد الخروج على أي حال؟'))return}
  SEC.locked=true;
  try{await SB.auth.signOut()}catch(e){}
  appLs(LS_ME,null);
  try{localStorage.removeItem(LS_CACHE);localStorage.removeItem(LS_PEND)}catch(e){}
  location.reload();
}
const appPwOk=(a,b)=>!a||a.length<8?'يجب أن تكون كلمة المرور ٨ حروف أو أرقام على الأقل.':a!==b?'كلمتا المرور غير متطابقتين.':'';
document.addEventListener('submit',async ev=>{
  const f=ev.target;if(!f||f.id!=='apForm')return;ev.preventDefault();
  const q=id=>{const e=document.getElementById(id);return e?e.value:''};
  const btn=document.getElementById('apBtn');if(btn)btn.disabled=true;
  APPU.msg='';APPU.info='';const kind=f.dataset.kind;
  try{
    if(kind==='login'){
      const email=q('ap_email').trim().toLowerCase(),password=q('ap_pw');APPU.email=email;
      if(!email||!password){APPU.msg='أدخل البريد الإلكتروني وكلمة المرور.';return appShow()}
      const {data,error}=await SB.auth.signInWithPassword({email,password});
      if(error){APPU.msg=authErr(error);return appShow()}
      if(await appTryEnter(data.session))appBioSupported().then(ok=>{if(ok&&!appBioCfg())showBanner('يمكنك فتح التطبيق بالبصمة بدل كلمة المرور. فعّلها من «الإعدادات» ثم «الفتح بالبصمة».')});return;
    }
    if(kind==='signup'){
      const name=q('ap_name').trim(),email=q('ap_email').trim().toLowerCase(),a=q('ap_pw'),b=q('ap_pw2');APPU.email=email;APPU.nameDraft=name;
      if(!name){APPU.msg='أدخل اسمك.';return appShow()}
      if(!emailOk(email)){APPU.msg='البريد الإلكتروني مكتوب بشكل غير صحيح.';return appShow()}
      const bad=appPwOk(a,b);if(bad){APPU.msg=bad;return appShow()}
      const {data,error}=await SB.auth.signUp({email,password:a,options:{data:{name},emailRedirectTo:location.origin+location.pathname}});
      if(error){APPU.msg=authErr(error);return appShow()}
      if(data&&data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length){APPU.msg='هذا البريد الإلكتروني مسجّل من قبل. سجّل الدخول به، وإذا نسيت كلمة المرور اضغط «نسيت كلمة المرور».';APPU.mode='login';return appShow()}
      if(data&&data.session){await appTryEnter(data.session);return}
      APPU.mode='checkmail';return appShow();
    }
    if(kind==='forgot'){
      const email=q('ap_email').trim().toLowerCase();APPU.email=email;
      if(!emailOk(email)){APPU.msg='أدخل البريد الإلكتروني بشكل صحيح.';return appShow()}
      const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
      if(error){APPU.msg=authErr(error);return appShow()}
      APPU.info='إذا كان هذا البريد الإلكتروني مرتبطًا بحساب، فسيصلك رابط. افتحه من الجهاز نفسه.';return appShow();
    }
    if(kind==='unlock'){
      const password=q('ap_pw');if(!password){APPU.msg='أدخل كلمة المرور.';return appShow()}
      if(!navigator.onLine){APPU.msg='الفتح بكلمة المرور يتطلب اتصالًا بالإنترنت. افتح بالبصمة، أو شغّل الإنترنت.';return appShow()}
      const {error}=await SB.auth.signInWithPassword({email:(APPU.me&&APPU.me.email)||'',password});
      if(error){APPU.msg=authErr(error);return appShow()}
      appBioDone();return;
    }
    if(kind==='newpw'){
      const a=q('ap_pw'),b=q('ap_pw2');const bad=appPwOk(a,b);if(bad){APPU.msg=bad;return appShow()}
      const {error}=await SB.auth.updateUser({password:a});
      if(error){APPU.msg=authErr(error);return appShow()}
      try{history.replaceState(null,'',location.pathname)}catch(e){}
      const ses=(await SB.auth.getSession()).data.session;
      if(ses){APPU.info='';await appTryEnter(ses)}else{APPU.mode='login';APPU.info='تم تغيير كلمة المرور. سجّل الدخول بكلمة المرور الجديدة.';appShow()}
      return;
    }
  }catch(e){APPU.msg=authErr(e);appShow()}
  finally{if(btn&&btn.isConnected)btn.disabled=false}
});

    const row=pl.new&&pl.new.path?pl.new:null,path=row?row.path:(pl.old&&pl.old.path);if(!path)return;

const APPDB={
  collection(col){
    const q={col,log:false,lim:0};
    q.orderBy=()=>{q.log=true;return q};
    q.limit=n=>{q.lim=n;return q};
    q.onSnapshot=(cb,err)=>{
      let L=APPLIS.get(col);
      if(!L){L={rows:new Map(),cbs:new Set(),log:q.log,lim:q.lim,ok:false};APPLIS.set(col,L)}
      const h={cb,err};L.cbs.add(h);appChannel();
      if(L.ok)setTimeout(()=>appEmit(col,h),0);else appRefresh(col);
      return ()=>L.cbs.delete(h);
    };
    return q;
  },
  doc(path){
    return {
      async set(data){
        if(!(await appHasSes()))throw {code:'unavailable'};
        const {error}=await SB.from('docs').upsert({path,data},{onConflict:'path'});if(error)throw sbErr(error);
        const L=APPLIS.get(pColOf(path));if(L){L.rows.set(path,data);appSchedEmit(pColOf(path))}
      },
      async delete(){
        if(!(await appHasSes()))throw {code:'unavailable'};
        const {error}=await SB.from('docs').delete().eq('path',path);if(error)throw sbErr(error);
        const L=APPLIS.get(pColOf(path));if(L){L.rows.delete(path);appSchedEmit(pColOf(path))}
      },

    };
  }
};

  for(const c in COLS)if(!Array.isArray(S.srv[COLS[c]]))S.srv[COLS[c]]=[];
  const m={};for(const c in COLS)m[c]=new Map(S.srv[COLS[c]].map(x=>[x.id,x]));
  S.pending=S.pending.filter(p=>{if(!m[p.col])return false;const sv=m[p.col].get(p.id);return !(sv&&(sv.updated||0)>=((p.data&&p.data.updated)||0))});
  for(const c in COLS){const k=COLS[c];const pend=S.pending.filter(p=>p.col===c);const pm=new Map(pend.map(p=>[p.id,p]));
    const tag=p=>({id:p.id,...p.data,_p:p.pfx??S.pfx??'',pending:true});
    S[k]=S.srv[k].map(x=>pm.has(x.id)?{...tag(pm.get(x.id)),_p:x._p??''}:x).concat(pend.filter(p=>!m[c].has(p.id)).map(tag))}
  if(typeof applyUserScope==='function')applyUserScope();
}
function savePending(){if(OFF)vaultSave();else lsSet(LS_PEND,S.pending)}
function saveCache(){const at=Date.now();if(lsSet(LS_CACHE,{sites:S.srv.sites,exp:S.srv.exp,dep:S.srv.dep,cnt:S.srv.cnt,log:S.srv.log,cons:S.srv.cons,items:S.srv.items,at}))S.cacheAt=at}
function pfxFor(col,data){
  if(data&&data._p!==undefined)return data._p;
  if(OFF)return '';
  if(data&&data.siteId){const st=(S.sites||[]).find(x=>x.id===data.siteId);if(st&&st._p!==undefined)return st._p}
  return S.pfx;
}
function queue(col,id,data){const pfx=pfxFor(col,data);const d={...data};delete d._p;delete d.pending;S.pending=S.pending.filter(p=>!(p.col===col&&p.id===id));S.pending.push({col,id,data:d,pfx});savePending();merge();flush()}
function canEditRec(r){
  if(!S.canWrite||!r)return false;
  if(S.isManager)return true;
  if(OFF)return !r.offUser||lc(r.offUser)===lc(SEC.user&&SEC.user.name);
  return !!S.pfx&&(r._p??'')===S.pfx;
}
async function flush(){
  if(OFF||!S.db||S.flushing||!S.pending.length||S.pfx===null)return;
  S.flushing=true;
  try{
    for(const p of [...S.pending]){
      try{const pf=p.pfx??S.pfx;if(p.pfx==null)p.pfx=pf;await withTimeout(S.db.doc(pf+p.col+'/'+p.id).set(p.data),12000)}
      catch(e){
        if(e&&e.code==='invalid_argument'){S.pending=S.pending.filter(x=>x!==p);savePending();showBanner('توجد عملية لم تُرفع لأن حسابك غير مسموح له بالتعديل في هذا المكان. التعديل في مواقع غيرك متاح للمستخدم الرئيسي فقط.');continue}
        break;
      }
    }
  }finally{S.flushing=false;render()}
}
function bal(siteId){
  const e=siteId?S.exp.filter(x=>x.siteId===siteId):S.exp, d=siteId?S.dep.filter(x=>x.siteId===siteId):S.dep;
  const ec=sum(e.filter(x=>meth(x)==='cash')),eb=sum(e)-ec,dc=sum(d.filter(x=>meth(x)==='cash')),db=sum(d)-dc;
  return {dep:dc+db,exp:ec+eb,cash:dc-ec,bank:db-eb,total:dc+db-ec-eb,ne:e.length,nd:d.length};
}

function balAt(siteId,date){
  const e=S.exp.filter(x=>x.siteId===siteId&&(x.date||'')<=date),d=S.dep.filter(x=>x.siteId===siteId&&(x.date||'')<=date);
  const ec=sum(e.filter(x=>meth(x)==='cash')),dc=sum(d.filter(x=>meth(x)==='cash'));
  return {cash:dc-ec,bank:(sum(d)-dc)-(sum(e)-ec)};
}
function countsOf(siteId){return S.cnt.filter(c=>c.siteId===siteId).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||0)-(a.created||0))}
function reconOf(c){
  const book=balAt(c.siteId,c.date);const cash=+c.cash||0,bank=+c.bank||0;
  const dc=cash-book.cash,dbk=bank-book.bank,d=dc+dbk;
  const st=Math.abs(d)<0.005?'ok':(d<0?'short':'over');
  return {c,book,cash,bank,dc,dbk,d,st,bookTotal:book.cash+book.bank,actual:cash+bank};
}

function bindSite(site){
  const form=$('#entryForm');
  if(form)form.onsubmit=async ev=>{
    ev.preventDefault();
    if(S.busy)return;
    const msg=$('#formMsg'),kind=S.kind,ed=S.editing;
    const col=kind==='exp'?'expenses':'deposits';
    const old=ed?(S[COLS[col]]||[]).find(x=>x.id===ed.id):null;
    const amount=parseFloat($('#e_amount').value);
    const rec={siteId:site.id,amount,date:$('#e_date').value,method:$('#e_method').value,notes:$('#e_notes').value.trim(),remarks:$('#e_remarks').value.trim(),by:old?(old.by||''):myBy()};
    if(kind==='exp'){rec.contractor=regValue('e_contractor','contractors');rec.item=regValue('e_item','items')}
    if(!(amount>0)){msg.className='msg err';msg.textContent='أدخل مبلغًا أكبر من صفر.';return}
    const miss=[];if(!rec.date)miss.push('التاريخ');if(kind==='exp'&&!rec.contractor)miss.push('المقاول');if(kind==='exp'&&!rec.item)miss.push('البند');if(!rec.notes)miss.push('البيان');
    if(miss.length){msg.className='msg err';msg.textContent='يجب أن تكتب: '+miss.join('، ')+'.';const first={'التاريخ':'#e_date','المقاول':'#e_contractor','البند':'#e_item','البيان':'#e_notes'}[miss[0]];if(first==='#e_contractor'&&$('#e_contractor').value==='__new')$('#e_contractor_new').focus();const el=$(first);if(el)el.focus();return}
    if(kind==='exp')commitNewRegs([['e_contractor','contractors'],['e_item','items']]);
    const file=S.pickedFile;
    if(old){rec.receipt=old.receipt||'';rec.receiptType=old.receiptType||''}
    if($('#e_rmphoto')&&$('#e_rmphoto').checked){rec.receipt='';rec.receiptType=''}
    if(file){
      if(!OFF&&S.mode!=='live'){msg.className='msg err';msg.textContent='رفع الصورة يحتاج إلى الإنترنت. احذف الصورة واحفظ، ثم أضفها لاحقًا من «تعديل».';return}
      const btn=$('#saveBtn');S.busy=true;btn.disabled=true;msg.className='msg';msg.textContent='جاري رفع الصورة…';
      try{const up=await uploadReceipt(file);rec.receipt=up.id;rec.receiptType=up.type}
      catch(e){S.busy=false;btn.disabled=false;msg.className='msg err';msg.textContent=uploadErr(e);return}
      S.busy=false;S.pickedFile=null;
    }
    if(!rec.receipt){delete rec.receipt;delete rec.receiptType}
    const later=(!OFF&&S.mode!=='live')?' على الجهاز، وسيُرفع عند عودة الاتصال بالإنترنت':'';
    if(old){
      const full={...clean(old),...rec,created:old.created||Date.now(),byId:old.byId||'',updated:Date.now(),editedById:S.uid||''};
      delete full.id;if(!rec.receipt){delete full.receipt;delete full.receiptType}
      if(kind==='exp'&&!rec.item)full.item='';
      queue(col,old.id,full);logChange('edit',col,full,old);
      S.lastMsg='تم حفظ التعديل'+later;S.editing=null;
    }else{
      rec.created=Date.now();rec.byId=S.uid||'';
      queue(col,newId(),rec);logChange('add',col,rec);
      S.lastMsg=(kind==='exp'?'تم حفظ مصروف '+fmt(amount)+' '+CUR+' للمقاول '+rec.contractor:'تم حفظ إيداع '+fmt(amount)+' '+CUR+' ('+METHOD[rec.method]+')')+(rec.receipt?' مع الإيصال':'')+later;
    }
    S.justSaved=true;S.tab=kind;
    render();
  };
  if(S.fillEdit&&S.editing){
    const r=(S[COLS[S.editing.col]]||[]).find(x=>x.id===S.editing.id);S.fillEdit=false;
    if(r){const setv=(id,v)=>{const el=$(id);if(el)el.value=v??''};setv('#e_amount',r.amount);setv('#e_date',r.date);setv('#e_method',meth(r));setv('#e_notes',r.notes);setv('#e_remarks',r.remarks);setRegFromRecord('e_contractor','contractors',r.contractor);setRegFromRecord('e_item','items',r.item)}
  }
  bindRegSelect('e_contractor','contractors');bindRegSelect('e_item','items');bindConItem('e_contractor','e_item');
  const ce=$('#cancelEdit');if(ce)ce.onclick=()=>{S.editing=null;S.pickedFile=null;S.justSaved=true;render()};
  const pf=$('#e_photo');if(pf)pf.onchange=()=>{S.pickedFile=pf.files&&pf.files[0]||null;render()};
  const mb=$('#moreBox');if(mb)mb.ontoggle=()=>{S.moreOpen=mb.open};
  if(S.lastMsg){S.flash={text:S.lastMsg,until:Date.now()+8000};S.lastMsg=''}
  if(S.flash&&S.flash.until>Date.now()&&$('#formMsg')){$('#formMsg').className='msg ok';$('#formMsg').textContent=S.flash.text}
  const setF=(k,id)=>{const el=$(id);if(el)el.onchange=()=>{S.filt[k]=el.value;render()}};
  setF('c','#f_c');setF('i','#f_i');setF('from','#f_from');setF('to','#f_to');setF('q','#f_q');
  const cf=$('#clearF');if(cf)cf.onclick=()=>{S.filt={c:'',i:'',from:'',to:'',q:''};render()};
  const ex=$('#exportSite');if(ex)ex.onclick=()=>exportExcel(site.id);
  const ds=$('#delSite');if(ds)ds.onclick=()=>{S.confirmSite=true;render()};
  const dn=$('#delSiteNo');if(dn)dn.onclick=()=>{S.confirmSite=false;render()};
  const dy=$('#delSiteYes');if(dy)dy.onclick=()=>removeDoc('sites',site.id).then(ok=>{if(ok){S.sel='__all';S.confirmSite=false;render()}});
}

async function removeDoc(col,id){
  if(!canEditRec(rec)){showBanner('غير مسموح لك بالحذف من موقع غيرك.');return false}
  const rec=(S[COLS[col]]||[]).find(x=>x.id===id);
  const p=S.pending.find(x=>x.col===col&&x.id===id);
  if(p){S.pending=S.pending.filter(x=>x!==p);savePending();merge();if(rec)logChange('delete',col,rec);render();return true}
  if(OFF){showBanner('هذه الحركة واردة من النسخة على الإنترنت، فاحذفها من هناك ثم نفّذ «تحديث» هنا.');return false}
  if(!S.db||S.mode!=='live'){showBanner('الحذف يتطلب اتصالًا بالإنترنت. حاول مرة أخرى عند عودة الاتصال.');return false}
  try{await withTimeout(S.db.doc(col+'/'+id).delete(),12000);showBanner('');if(rec)logChange('delete',col,rec);return true}
  catch(e){showBanner(errText(e));return false}
}
/* ---------- دفتر اليومية (journal) ---------- */
function journalRows(){
  const rows=[...S.dep.map(x=>({...x,k:'dep',col:'deposits'})),...S.exp.map(x=>({...x,k:'exp',col:'expenses'}))]
    .sort((a,b)=>(a.created||0)-(b.created||0));
  rows.forEach((r,i)=>r.no=i+1);
  return rows;
}
function renderJournal(){
  const jf=S.jf,K=S.jKeep;
  const all=journalRows();
  let list=all.filter(r=>(!jf.site||r.siteId===jf.site)&&(!jf.type||r.k===jf.type)&&(!jf.from||(r.date||'')>=jf.from)&&(!jf.to||(r.date||'')<=jf.to)&&(!jf.q||[r.notes,r.remarks,r.contractor,r.item,siteNameOf(r.siteId)].some(v=>(v||'').includes(jf.q))));
  list.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.created||0)-(b.created||0));
  let run=0;for(const r of list){run+=r.k==='dep'?amt(r):-amt(r);r.run=run}
  const tin=list.filter(r=>r.k==='dep').reduce((a,r)=>a+amt(r),0),tout=list.filter(r=>r.k==='exp').reduce((a,r)=>a+amt(r),0);
  const shown=list.slice().reverse().slice(0,S.jLimit);
  const filtOn=jf.site||jf.type||jf.from||jf.to||jf.q;
  const allCons=uniq(S.exp,'contractor'),allItems=uniq(S.exp,'item');
  const canPhoto=OFF?S.canWrite:!!S.assets;
  const isExp=(K.type||'exp')==='exp';
  const siteOpts=S.sites.map(s=>`<option value="${esc(s.id)}" ${K.site===s.id?'selected':''}>${esc(s.name)}</option>`).join('');
  const acts=r=>!S.canWrite?'':!canEditRec(r)?'<td></td>':`<td class="acts">${S.confirmDel===r.col+':'+r.id?`<span class="confirm"><button class="danger" data-delyes="${r.col}:${esc(r.id)}">تأكيد الحذف</button><button data-delno="1">إلغاء</button></span>`:`<button class="ghost" data-edit="${r.col}:${esc(r.id)}">تعديل</button><button class="ghost" data-del="${r.col}:${esc(r.id)}">حذف</button>`}</td>`;
  $('#pane').innerHTML=`
  <div class="pane-h"><h2>دفتر اليومية</h2><div class="actions"><button data-print="journal">طباعة / PDF</button>${S.downloads?'<button id="exportAll">حفظ ملف Excel</button>':''}</div></div>
  <p class="foot-note" style="margin:-8px 0 0">سجّل هنا جميع الحركات واختر الموقع، وستُرحَّل كل حركة تلقائيًا إلى حساب موقعها.</p>
  ${S.canWrite?(S.sites.length?`<div class="card entry-card j-card">
    <form class="entry j-entry" id="jForm" autocomplete="off" novalidate>
      <div class="f c1 half"><label for="j_type">النوع</label><select id="j_type"><option value="exp" ${isExp?'selected':''}>مصروف</option><option value="dep" ${!isExp?'selected':''}>إيداع من المالك</option></select></div>
      <div class="f c2 half"><label for="j_site">الموقع</label><select id="j_site"><option value="">اختر الموقع</option>${siteOpts}</select></div>
      <div class="f c1 half"><label for="j_amount">المبلغ (${CUR})</label><input id="j_amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00"></div>
      <div class="f c1 half"><label for="j_date">التاريخ</label><input id="j_date" type="date" value="${esc(K.date||today())}"></div>
      <div class="f c1 half"><label for="j_method">طريقة الدفع</label><select id="j_method">${Object.entries(METHOD).map(([k,v])=>`<option value="${k}" ${(K.method||'cash')===k?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="f c2"><label for="j_notes">البيان</label><input id="j_notes" maxlength="300" placeholder="${isExp?'وصف المصروف':'مثال: دفعة من المالك على حساب الموقع'}"></div>
      <div class="f c2 j-exp" ${isExp?'':'hidden'}><label for="j_item">البند</label>${regSelect('j_item','items')}</div>
      <div class="f c2 j-exp" ${isExp?'':'hidden'}><label for="j_contractor">المقاول</label>${regSelect('j_contractor','contractors')}</div>
      ${moreBox(`<div class="f c2"><label for="j_remarks">ملاحظات</label><input id="j_remarks" maxlength="300" placeholder="رقم المستخلص، رقم الشيك…"></div>
      <div class="f c2"><label for="j_photo">صورة الإيصال</label>${canPhoto?`<input id="j_photo" type="file" accept="image/*,application/pdf">${S.pickedFile?`<span class="note ok-note">المحدد: ${esc(S.pickedFile.name||'صورة')}</span>`:''}`:`<input disabled placeholder="رفع الصور غير متاح بهذه الصلاحية">`}</div>`,S.moreOpen||!!S.pickedFile)}
      <div class="form-foot"><button class="primary" type="submit" id="jSave">تسجيل وترحيل</button><span class="msg" id="jMsg"></span></div>
      <datalist id="dl_con">${allCons.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
      <datalist id="dl_item">${allItems.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
    </form>
    <p class="foot-note" style="margin:10px 0 0">بعد الحفظ يبقى النوع والموقع والتاريخ كما هي، لكي تسجّل الحركة التالية مباشرةً.</p></div>`
    :`<div class="card blank" style="padding:24px"><h3>لا توجد مواقع بعد</h3><p>${S.canWrite?'أضف موقعًا من خانة «اسم موقع جديد» أولًا، ثم سجّل هنا.':'لا توجد مواقع متاحة لك.'}</p></div>`):''}
  <div class="stats">
    <div class="stat"><div class="l">وارد (إيداعات)${filtOn?' · حسب الفلتر':''}</div><div class="v in">${fmt(tin)}<small>${CUR}</small></div></div>
    <div class="stat"><div class="l">منصرف (مصروفات)${filtOn?' · حسب الفلتر':''}</div><div class="v">${fmt(tout)}<small>${CUR}</small></div></div>
    <div class="stat"><div class="l">الرصيد${filtOn?' · حسب الفلتر':''}</div><div class="v bal${negCls(tin-tout)}">${fmt(tin-tout)}<small>${CUR}</small></div><div class="split"><span>${list.length} حركة</span></div></div>
  </div>
  <div class="card" style="display:flex;flex-direction:column;gap:12px">
    <div class="filters">
      <div class="f"><label for="jf_site">الموقع</label><select id="jf_site"><option value="">كل المواقع</option>${S.sites.map(s=>`<option value="${esc(s.id)}" ${jf.site===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
      <div class="f"><label for="jf_type">النوع</label><select id="jf_type"><option value="">الكل</option><option value="dep" ${jf.type==='dep'?'selected':''}>وارد</option><option value="exp" ${jf.type==='exp'?'selected':''}>منصرف</option></select></div>
      <div class="f"><label for="jf_from">من تاريخ</label><input id="jf_from" type="date" value="${esc(jf.from)}"></div>
      <div class="f"><label for="jf_to">إلى تاريخ</label><input id="jf_to" type="date" value="${esc(jf.to)}"></div>
      <div class="f"><label for="jf_q">بحث</label><input id="jf_q" value="${esc(jf.q)}" placeholder="اكتب كلمة"></div>
      ${filtOn?'<button class="ghost" id="jfClear">مسح الفلتر</button>':''}
    </div>
    ${shown.length?`<div class="tbl-wrap"><table class="j-t"><thead><tr><th class="num">رقم القيد</th><th>التاريخ</th><th>الموقع</th><th class="num">وارد</th><th class="num">منصرف</th><th>البيان</th><th>البند</th><th>المقاول</th><th>ملاحظات</th><th class="num">الرصيد بعد الحركة</th>${S.canWrite?'<th></th>':''}</tr></thead><tbody>
    ${shown.map(r=>`<tr><td class="num plain">${r.no}</td><td class="date">${esc(r.date)}</td><td><button class="linkish" data-site="${esc(r.siteId)}">${esc(siteNameOf(r.siteId))||'—'}</button></td>
      <td class="num in">${r.k==='dep'?fmt(amt(r))+`<span class="mtag">${METHOD[meth(r)]}</span>`:''}</td><td class="num">${r.k==='exp'?fmt(amt(r))+`<span class="mtag">${METHOD[meth(r)]}</span>`:''}</td>
      <td>${esc(r.notes)||(r.k==='dep'?'إيداع من المالك':'—')}${r.pending?`<span class="pend">${PEND}</span>`:''}</td><td>${r.item?`<span class="chip">${esc(r.item)}</span>`:'—'}</td><td>${esc(r.contractor)||'—'}</td>
      <td>${esc(r.remarks)||'—'}${r.by?`<span class="note">سجّله: ${esc(r.by)}</span>`:''}${r.receipt?`<button class="rcpt" data-receipt="${esc(r.receipt)}" data-rtype="${esc(r.receiptType||'')}">عرض الإيصال</button>`:''}</td>
      <td class="num strong${negCls(r.run)}">${fmt(r.run)}</td>${acts(r)}</tr>`).join('')}
    </tbody></table></div>${list.length>S.jLimit?`<button class="ghost" id="jMore">عرض ${Math.min(200,list.length-S.jLimit)} حركة أقدم</button>`:''}`
    :`<div class="blank" style="padding:28px 8px"><h3>${all.length?'لا توجد حركات لهذا الفلتر':'لا توجد حركات بعد'}</h3><p>${all.length?'غيّر الفلتر أو امسحه.':'ستظهر هنا أول حركة تسجّلها.'}</p></div>`}
  </div>`;
  bindJournal();

function bindJournal(){
  const on=(id,ev,fn)=>{const el=$(id);if(el)el[ev]=fn};
  on('#exportAll','onclick',()=>exportExcel(null));
  const setF=(k,id)=>on(id,'onchange',e=>{S.jf[k]=e.target.value;S.jLimit=200;render()});
  setF('site','#jf_site');setF('type','#jf_type');setF('from','#jf_from');setF('to','#jf_to');setF('q','#jf_q');
  on('#jfClear','onclick',()=>{S.jf={site:'',type:'',from:'',to:'',q:''};render()});
  on('#jMore','onclick',()=>{S.jLimit+=200;render()});
  on('#j_type','onchange',e=>{S.jKeep.type=e.target.value;document.querySelectorAll('.j-exp').forEach(x=>x.hidden=e.target.value!=='exp');const n=$('#j_notes');if(n)n.placeholder=e.target.value==='exp'?'وصف المصروف':'مثال: دفعة من المالك على حساب الموقع'});
  on('#j_site','onchange',e=>{S.jKeep.site=e.target.value});
  bindRegSelect('j_item','items');bindRegSelect('j_contractor','contractors');bindConItem('j_contractor','j_item');
  {const mb=$('#moreBox');if(mb)mb.ontoggle=()=>{S.moreOpen=mb.open}}
  on('#j_photo','onchange',e=>{S.pickedFile=e.target.files&&e.target.files[0]||null;render()});
  if(S.flash&&S.flash.until>Date.now()&&$('#jMsg')){$('#jMsg').className='msg ok';$('#jMsg').textContent=S.flash.text}
  const f=$('#jForm');if(!f)return;
  f.onsubmit=async ev=>{
    ev.preventDefault();if(S.busy)return;
    const msg=$('#jMsg'),type=$('#j_type').value,site=$('#j_site').value;
    const amount=parseFloat($('#j_amount').value);
    const rec={siteId:site,amount,date:$('#j_date').value,method:$('#j_method').value,notes:$('#j_notes').value.trim(),remarks:$('#j_remarks').value.trim(),by:myBy()};
    if(type==='exp'){rec.contractor=regValue('j_contractor','contractors');rec.item=regValue('j_item','items')}
    const miss=[];if(!site)miss.push('الموقع');if(!(amount>0))miss.push('المبلغ');if(!rec.date)miss.push('التاريخ');if(!rec.notes)miss.push('البيان');if(type==='exp'&&!rec.item)miss.push('البند');if(type==='exp'&&!rec.contractor)miss.push('المقاول');
    if(miss.length){msg.className='msg err';msg.textContent='يجب أن تكتب: '+miss.join('، ')+'.';const el=$({'الموقع':'#j_site','المبلغ':'#j_amount','التاريخ':'#j_date','البيان':'#j_notes','البند':'#j_item','المقاول':'#j_contractor'}[miss[0]]);if(el)el.focus();return}
    if(type==='exp')commitNewRegs([['j_contractor','contractors'],['j_item','items']]);
    if(S.pickedFile){
      if(!OFF&&S.mode!=='live'){msg.className='msg err';msg.textContent='رفع الصورة يحتاج إلى الإنترنت. احذف الصورة وسجّل، ثم أضفها لاحقًا من «تعديل».';return}
      const btn=$('#jSave');S.busy=true;btn.disabled=true;msg.className='msg';msg.textContent='جاري رفع الصورة…';
      try{const up=await uploadReceipt(S.pickedFile);rec.receipt=up.id;rec.receiptType=up.type}
      catch(e){S.busy=false;btn.disabled=false;msg.className='msg err';msg.textContent=uploadErr(e);return}
      S.busy=false;S.pickedFile=null;
    }
    rec.created=Date.now();rec.byId=S.uid||'';
    const col=type==='exp'?'expenses':'deposits';
    queue(col,newId(),rec);logChange('add',col,rec);
    S.jKeep={type:'exp',site,date:rec.date,method:type==='exp'?rec.method:'cash'};
    const later=(!OFF&&S.mode!=='live')?' على الجهاز، وسيُرفع عند عودة الاتصال بالإنترنت':'';
    S.flash={text:(type==='exp'?'تم تسجيل مصروف ':'تم تسجيل إيداع ')+fmtPlain(amount)+' '+CUR+' ورُحِّل على '+siteNameOf(site)+later,until:Date.now()+8000};
    S.justSaved=true;render();const a=$('#j_amount');if(a)a.focus();
  };
}
async function shrinkImage(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type))return file;
  try{
    const bmp=await createImageBitmap(file);const M=1600,k=Math.min(1,M/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));return b&&b.size<file.size?b:file;
  }catch(e){return file}
}
async function uploadReceipt(file){
  if(OFF){
    const ok=/^image\/(jpeg|png|webp|gif)$/.test(file.type)||file.type==='application/pdf';if(!ok)throw {code:'unsupported_type'};
    if(file.size>15*1024*1024)throw {code:'too_large'};
    const blob=await shrinkImage(file),type=blob.type||file.type,id='L'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    await rcPut(id,blob,type);return {id,type};
  }
  if(!S.assets)throw {code:'not_granted'};
  const ok=/^image\/(jpeg|png|webp|gif)$/.test(file.type)||file.type==='application/pdf';
  if(!ok)throw {code:'unsupported_type'};
  const blob=await shrinkImage(file);const type=blob.type||file.type;
  if(APP)return appStoreReceipt(blob,type);
  const r=await S.assets.upload(blob,{type});return {id:r.id,type};
}
function uploadErr(e){
  const c=e&&e.code;
  if(c==='unsupported_type')return 'نوع هذا الملف غير مدعوم. ارفع صورة (JPG أو PNG) أو PDF.';
  if(c==='too_large')return 'الملف كبير جدًا. صوّره مرة أخرى بحجم أصغر.';
  if(c==='quota_or_state')return 'امتلأت مساحة الصور. تواصل مع المسؤول عن التطبيق.';
  if(c==='rate_limited')return 'انتظر قليلًا وحاول مرة أخرى.';
  if(c==='not_granted'||c==='capability_disabled')return 'رفع الصور غير متاح بهذه الصلاحية.';
  return 'تعذّر رفع الصورة. تأكد من الاتصال بالإنترنت وحاول مرة أخرى.';
}
function viewerHTML(){
  const v=S.viewer;if(!v)return '';
  if((OFF||APP)&&!v.url)return `<div class="viewer" id="viewer" role="dialog" aria-label="الإيصال"><div class="vbox"><div class="vbar"><b>الإيصال</b><button id="closeViewer">قفل</button></div><p class="note" style="margin:16px">${v.missing&&APP?'صورة الإيصال غير موجودة أو غير مسموح لك بعرضها.':v.missing?'صورة الإيصال هذه غير موجودة على هذا الجهاز. نفّذ «تحديث» بملف نسخة احتياطية جديد من النسخة على الإنترنت، وسيجلب معه الصور.':'جاري فتح الصورة…'}</p></div></div>`;
  const src=v.url||('/_blob/'+encodeURIComponent(v.id));
  return `<div class="viewer" id="viewer" role="dialog" aria-label="الإيصال"><div class="vbox"><div class="vbar"><b>الإيصال</b><button id="closeViewer">قفل</button></div>
    ${v.type==='application/pdf'?`<p class="note">الإيصال ملف PDF.</p><a class="primary-link" href="${src}" target="_blank" rel="noopener">افتح الملف</a>`:`<img src="${src}" alt="صورة الإيصال">`}</div></div>`;
}
function errText(e){
  const c=e&&e.code;
  if(c==='invalid_argument')return 'غير مسموح لك بتعديل البيانات. اطلب من صاحب التطبيق صلاحية Contributor أو Editor.';
  if(c==='quota_exceeded')return 'امتلأت مساحة التخزين. احذف بعض السجلات القديمة وحاول مرة أخرى.';
  if(c==='resource_exhausted')return 'عمليات كثيرة في وقت قصير. انتظر بضع ثوانٍ وحاول مرة أخرى.';
  return 'لم تنجح العملية. تأكد من الاتصال وحاول مرة أخرى.';
}

/* ---------- minimal .xlsx writer (no external library) ---------- */
const XLSX_W=(()=>{
  const enc=new TextEncoder();
  const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
  const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
  function zip(files){
    const parts=[],central=[];let off=0;
    const d=new Date(),dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
    for(const [name,str] of files){
      const nb=enc.encode(name),data=enc.encode(str),crc=crc32(data);
      const h=new DataView(new ArrayBuffer(30));
      h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);
      h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nb.length,true);h.setUint16(28,0,true);
      parts.push(new Uint8Array(h.buffer),nb,data);
      const c=new DataView(new ArrayBuffer(46));
      c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);
      c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);
      central.push(new Uint8Array(c.buffer),nb);
      off+=30+nb.length+data.length;
    }
    const csize=central.reduce((a,b)=>a+b.length,0);
    const e=new DataView(new ArrayBuffer(22));
    e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csize,true);e.setUint32(16,off,true);
    return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  }
  const x=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F⁦-⁩]/g,'');
  const col=i=>{let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
  function sheetXml(sh){
    const rows=sh.rows,widths=sh.widths||[];
    let out='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0" rightToLeft="1">'+(sh.freeze?'<pane ySplit="'+sh.freeze+'" topLeftCell="A'+(sh.freeze+1)+'" activePane="bottomLeft" state="frozen"/>':'')+'</sheetView></sheetViews>';
    const n=Math.max(0,...rows.map(r=>r.length));
    if(n){out+='<cols>';for(let i=0;i<n;i++)out+='<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+(widths[i]||14)+'" customWidth="1"/>';out+='</cols>'}
    out+='<sheetData>';
    rows.forEach((r,ri)=>{
      const st=(sh.styles&&sh.styles[ri])||0;
      out+='<row r="'+(ri+1)+'">';
      r.forEach((v,ci)=>{
        if(v===null||v===undefined||v==='')return;
        const ref=col(ci)+(ri+1);
        if(typeof v==='number'&&isFinite(v))out+='<c r="'+ref+'" s="'+(st===1?4:st===3?5:2)+'"><v>'+v+'</v></c>';
        else out+='<c r="'+ref+'" t="inlineStr" s="'+(st===1?1:st===3?3:0)+'"><is><t xml:space="preserve">'+x(v)+'</t></is></c>';
      });
      out+='</row>';
    });

let DEK_RAW=null;
/* ---------- security: PIN lock (online) + multi-user encrypted vault (offline) ---------- */
const PIN_SALT='adc-site-accounts-2026',PIN_HASH='3N3Q6OnUFl5TkhzDOWRGJreEhRCcEY5s3oP2FQFvw+k=',PIN_LEN=6;
const ADC_SALT='adc-off-32472c66b4f0',ADC_HASH='+bFumpvkeJ1jzJB36rzXQcWj1yklYZOxby3v8UjzUq8=',MAIN_USER='ADC';
const LS_PIN='adc_pin_v1',LS_AUTH='adc_off_auth_v1',LS_VAULT='adc_off_vault_v1';
const SEC={key:null,user:null,locked:false,last:Date.now(),fails:0,until:0,mode:'',msg:'',chpw:false,addUser:false,resetFor:'',delUser:'',note:''};
const te=new TextEncoder(),td=new TextDecoder();
const b64=u=>{const a=new Uint8Array(u);let s='';for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const lc=s=>String(s||'').trim().toLowerCase();
async function sha(s){return b64(await crypto.subtle.digest('SHA-256',te.encode(s)))}
async function deriveKey(pw,salt){
  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
const userKey=(name,pw,salt)=>deriveKey(lc(name)+'\u0000'+pw,salt);
async function enc(key,obj){const iv=rnd(12);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj)));return {iv:b64(iv),ct:b64(ct)}}
async function dec(key,box){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(box.iv)},key,unb64(box.ct));return JSON.parse(td.decode(pt))}
const importDek=raw=>crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt']);
async function wrapFor(name,pw,dekRaw){const salt=rnd(16);return {salt:b64(salt),wrap:await enc(await userKey(name,pw,salt),{k:b64(dekRaw)})}}
const auth=()=>lsGet(LS_AUTH);
const isAdmin=()=>!OFF||(SEC.user&&SEC.user.role==='admin');
const idleMin=()=>OFF?((auth()||{}).idle||10):((lsGet(LS_PIN)||{}).idle||5);
const lockOn=()=>true;

/* per-user site visibility (computer version) */
function applyUserScope(){
  if(!OFF||!SEC.user||SEC.user.role==='admin')return;
  const me=lc(SEC.user.name);
  S.sites=S.sites.filter(s=>lc(s.offUser)===me);
  const ids=new Set(S.sites.map(s=>s.id));
  S.exp=S.exp.filter(x=>ids.has(x.siteId));S.dep=S.dep.filter(x=>ids.has(x.siteId));S.cnt=S.cnt.filter(x=>ids.has(x.siteId));
  S.log=S.log.filter(x=>ids.has(x.siteId)||(x.kind==='sites'&&ids.has(x.siteId)));
}

/* vault */
let vaultTimer=0;
const vaultObj=()=>({base:{sites:S.srv.sites,exp:S.srv.exp,dep:S.srv.dep,cnt:S.srv.cnt,log:S.srv.log,cons:S.srv.cons,items:S.srv.items,at:S.baseAt},local:S.pending});
function vaultSave(){
  if(!OFF||!SEC.key)return;
  clearTimeout(vaultTimer);
  vaultTimer=setTimeout(async()=>{try{lsSet(LS_VAULT,await enc(SEC.key,vaultObj()));lsSet(LS_META,{savedAt:Date.now()});dbFileSave()}catch(e){}},150);
}
async function vaultLoad(){
  const box=lsGet(LS_VAULT);if(!box)return;
  const v=await dec(SEC.key,box);const base=v.base||{};
  if(Array.isArray(base.sites)){S.srv={sites:base.sites,exp:base.exp||[],dep:base.dep||[],cnt:base.cnt||[],log:base.log||[],cons:base.cons||[],items:base.items||[]};S.baseAt=base.at||null}
  S.pending=v.local||[];
}
/* input normalisation: Arabic/Persian digits, Arabic keyboard layout typed by mistake */
const toLatinDigits=s=>String(s||'').replace(/[٠-٩]/g,d=>d.charCodeAt(0)-0x660).replace(/[۰-۹]/g,d=>d.charCodeAt(0)-0x6F0);
const AR_KB={'ض':'q','ص':'w','ث':'e','ق':'r','ف':'t','غ':'y','ع':'u','ه':'i','خ':'o','ح':'p','ج':'[','د':']','ش':'a','س':'s','ي':'d','ب':'f','ل':'g','ا':'h','ت':'j','ن':'k','م':'l','ك':';','ط':"'",'ئ':'z','ء':'x','ؤ':'c','ر':'v','ى':'n','ة':'m','و':',','ز':'.','ظ':'/','ذ':'`','أ':'h','إ':'h','آ':'h'};
const fromArKb=s=>toLatinDigits(String(s||'').replace(/لا/g,'b').split('').map(c=>AR_KB[c]??c).join(''));
const hasAr=s=>/[؀-ۿ]/.test(s||'');
function loginVariants(u,p){
  const us=[u.trim()],ps=[p];
  const p2=toLatinDigits(p).trim();if(p2!==p)ps.push(p2);
  if(hasAr(u))us.push(fromArKb(u).trim());
  if(hasAr(p)){const p3=fromArKb(p);if(!ps.includes(p3))ps.push(p3)}
  const out=[];for(const a of us)for(const b of ps)out.push([a,b]);return out;
}
async function offLogin(name,pw){
  let a=auth();
  // first run on this computer: only the main user, with the agreed password
  if(!a||!a.users){
    let legacy=null;
    if(a&&a.check){ // earlier single-user format
      try{const k=await userKey(name,pw,unb64(a.salt));await dec(k,a.check);legacy=k}catch(e){}
      if(!legacy&&!(lc(name)===lc(MAIN_USER)&&await sha(ADC_SALT+'|'+lc(name)+'|'+pw)===ADC_HASH))return false;
    }else if(!(lc(name)===lc(MAIN_USER)&&await sha(ADC_SALT+'|'+lc(name)+'|'+pw)===ADC_HASH))return false;
    let data=null;
    if(legacy){try{const box=lsGet(LS_VAULT);if(box)data=await dec(legacy,box)}catch(e){}}
    else{const base=lsGet(LS_BASE),local=lsGet(LS_LOCAL);data={base:base||{},local:local||[]}}
    const raw=rnd(32);
    const u=lc(name)===lc(MAIN_USER)?MAIN_USER:name.trim();
    a={v:2,idle:(a&&a.idle)||10,users:{[lc(u)]:{name:u,role:'admin',...await wrapFor(u,pw,raw)}}};
    lsSet(LS_AUTH,a);SEC.key=await importDek(raw);SEC.user={name:u,role:'admin'};DEK_RAW=raw;
    if(data){const base=data.base||{};if(Array.isArray(base.sites)){S.srv={sites:base.sites,exp:base.exp||[],dep:base.dep||[],cnt:base.cnt||[],log:base.log||[],cons:base.cons||[],items:base.items||[]};S.baseAt=base.at||null}S.pending=data.local||[]}
    lsSet(LS_VAULT,await enc(SEC.key,vaultObj()));
    try{localStorage.removeItem(LS_BASE);localStorage.removeItem(LS_LOCAL)}catch(e){}
    return true;
  }
  const rec=a.users[lc(name)];if(!rec)return false;
  try{const w=await dec(await userKey(rec.name,pw,unb64(rec.salt)),rec.wrap);const raw=unb64(w.k);SEC.key=await importDek(raw);SEC.user={name:rec.name,role:rec.role};DEK_RAW=rec.role==='admin'?raw:null;await vaultLoad();return true}
  catch(e){return false}
}

function showLock(){
  let el=document.getElementById('lock');
  if(!el){el=document.createElement('div');el.id='lock';el.className='lock';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');document.body.appendChild(el)}
  document.body.classList.add('is-locked');el.hidden=false;el.innerHTML=lockHTML();bindLock();
  const pre=el.querySelector('#lk_user');const f=(pre&&pre.value&&el.querySelector('#lk_pw'))||el.querySelector('input:not([disabled])');if(f)f.focus();
}
function hideLock(){const el=document.getElementById('lock');if(el){el.hidden=true;el.innerHTML=''}document.body.classList.remove('is-locked');SEC.locked=false;SEC.msg='';SEC.forgot=false;SEC.last=Date.now()}
function failWait(){SEC.fails++;if(SEC.fails>=5){SEC.until=Date.now()+30000*Math.min(4,SEC.fails-4);setTimeout(()=>{if(SEC.locked)showLock()},1000)}}
function bindLock(){
  const f=document.getElementById('lkForm'),q=id=>document.getElementById(id);
  if(f)f.onsubmit=async ev=>{
    ev.preventDefault();SEC.msg='';
    if(SEC.until>Date.now())return;
    const btn=q('lkBtn');if(btn)btn.disabled=true;
    try{
      if(OFF){
        const u=q('lk_user').value.trim(),p=q('lk_pw').value;SEC.lastUser=u;
        if(!u||!p){SEC.msg='أدخل اسم المستخدم وكلمة المرور.';return showLock()}
        if(!window.crypto||!crypto.subtle){SEC.msg='الملف مفتوح في مكان لا يدعم التشفير (مثل معاينة الملفات). نزّل الملف على الجهاز وافتحه بـ Chrome أو Edge.';return showLock()}
        let ok=false;
        try{for(const [a,b] of loginVariants(u,p)){if(await offLogin(a,b)){ok=true;break}}}
        catch(e){SEC.msg='حدثت مشكلة أثناء تسجيل الدخول ('+(e&&e.name||'خطأ')+'). حمّل الملف على الجهاز وافتحه باستخدام Chrome أو Edge، وليس من معاينة الملفات.';return showLock()}
        if(!ok){failWait();SEC.msg='اسم المستخدم أو كلمة المرور غير صحيحة.'+(hasAr(u)?' اسم المستخدم مكتوب بحروف عربية، غيّر لوحة المفاتيح إلى الإنجليزية واكتبه مرة أخرى.':' تأكد من أن لوحة المفاتيح بالإنجليزية وأن Caps Lock غير مفعّل.');return showLock()}
        SEC.fails=0;S.isManager=SEC.user.role==='admin';S.roleKnown=true;SEC.info='';
        await fsInit(true);const synced=await syncFromDbFile();
        merge();hideLock();S.sel='__all';S.loaded=true;if(synced)SEC.note='تم تحميل آخر نسخة من ملف قاعدة البيانات «'+FS.db.name+'».';render();dbFileSave();return;
      }
      const pin=q('lk_pin').value.trim();
      if(pin.length===PIN_LEN&&await sha(PIN_SALT+pin)===PIN_HASH){SEC.fails=0;hideLock();render();return}
      failWait();SEC.msg='الـ PIN غير صحيح.';showLock();
    }finally{if(btn&&btn.isConnected&&SEC.until<=Date.now())btn.disabled=false}
  };
  const pi=q('lk_pin');if(pi)pi.oninput=()=>{pi.value=toLatinDigits(pi.value).replace(/\D/g,'').slice(0,PIN_LEN);if(pi.value.length===PIN_LEN&&f)f.requestSubmit()};
  const fg=q('lkForgot');if(fg)fg.onclick=()=>{SEC.forgot=true;showLock()};
  const sh=q('lk_show');if(sh)sh.onchange=()=>{const p=q('lk_pw');if(p)p.type=sh.checked?'text':'password'};
  const od=q('lkOpenDb');if(od)od.onclick=openDbFile;
  const wg=q('lkWipeGo');if(wg)wg.onclick=()=>{SEC.mode='wipe';SEC.msg='';showLock()};
  const bk=q('lkBack');if(bk)bk.onclick=()=>{SEC.mode='';SEC.msg='';showLock()};
  const w=q('lkWipe');if(w)w.onsubmit=ev=>{ev.preventDefault();
    if(q('lk_wipe').value.trim()!=='مسح'){SEC.msg='اكتب كلمة «مسح» بالضبط.';return showLock()}
    for(const k of [LS_AUTH,LS_VAULT,LS_BASE,LS_LOCAL,LS_META])try{localStorage.removeItem(k)}catch(e){}
    if(typeof hSet==='function'){hSet('db',null);FS.db=null;FS.dbPerm=''}
    S.srv={sites:[],exp:[],dep:[],cnt:[],log:[],cons:[],items:[]};S.pending=[];S.baseAt=null;merge();SEC.mode='';SEC.forgot=false;SEC.msg='';SEC.lastUser=MAIN_USER;showLock()};
}
function lockNow(){
  if(APP){if(appBioCfg())appBioLockNow();else appSignOut();return}
  SEC.locked=true;SEC.forgot=false;
  if(OFF){SEC.key=null;SEC.user=null;DEK_RAW=null;S.srv={sites:[],exp:[],dep:[],cnt:[],log:[],cons:[],items:[]};S.pending=[];merge();S.loaded=false;$('#pane').innerHTML='';$('#sites').innerHTML=''}

/* the data key is kept non-extractable; the admin re-derives it from their own wrap held in memory at login */
async function exportDek(){return DEK_RAW}
/* ---------- receipts kept on this computer (encrypted, IndexedDB) ---------- */
const isLocalRc=id=>typeof id==='string'&&id.startsWith('L');
function idb2(){return new Promise((res,rej)=>{const r=indexedDB.open('adc-fs',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('h'))d.createObjectStore('h');if(!d.objectStoreNames.contains('rc'))d.createObjectStore('rc')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function rcSetRaw(id,v){const d=await idb2();await new Promise((res,rej)=>{const t=d.transaction('rc','readwrite');t.objectStore('rc').put(v,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function rcGetRaw(id){try{const d=await idb2();return await new Promise(r=>{const q=d.transaction('rc').objectStore('rc').get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}}
async function rcPut(id,blob,type){const iv=rnd(12);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},SEC.key,await blob.arrayBuffer());await rcSetRaw(id,{iv:b64(iv),ct:b64(ct),type:type||blob.type})}
async function rcGet(id){const r=await rcGetRaw(id);if(!r||!SEC.key)return null;const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(r.iv)},SEC.key,unb64(r.ct));return new Blob([pt],{type:r.type})}
const blobToB64=b=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(String(f.result).split(',')[1]||'');f.onerror=rej;f.readAsDataURL(b)});
const b64ToBlob=(s,type)=>new Blob([unb64(s)],{type});
/* receipts referenced by a set of records */
const rcIdsOf=recs=>[...new Set(recs.filter(x=>x.receipt).map(x=>x.receipt))];
/* plain images for transfer files: computer -> online (local ids) or online -> computer (server ids) */
async function collectReceipts(onlyLocal){
  const out={},ids=rcIdsOf([...S.exp,...S.dep]).filter(id=>onlyLocal?isLocalRc(id):true);
  for(const id of ids){
    try{
      let blob=null,type='';
      if(OFF){blob=await rcGet(id)}
      else if(APP){blob=await appBlob(id)}
      else{const r=await fetch('/_blob/'+encodeURIComponent(id));if(r.ok)blob=await r.blob()}
      if(blob){type=blob.type||'image/jpeg';out[id]={type,data:await blobToB64(blob)}}
    }catch(e){}
  }
  return out;
}
/* encrypted copies for the computer's own backup files */
async function collectRawReceipts(){const out={};for(const id of rcIdsOf([...S.srv.exp,...S.srv.dep,...S.pending.filter(p=>p.data).map(p=>p.data)])){const r=await rcGetRaw(id);if(r)out[id]=r}return out}
/* ---------- database file + backup folder (computer version) ---------- */
const FS_OK=OFF&&typeof window.showSaveFilePicker==='function'&&typeof window.showDirectoryPicker==='function';

const FS={db:null,bk:null,dbPerm:'',bkPerm:'',dbSaved:0,bkSaved:0,err:'',busy:false};
function idb(){return idb2()}
async function hGet(k){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('h').objectStore('h').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}}
async function hSet(k,v){try{const d=await idb();await new Promise(r=>{const t=d.transaction('h','readwrite');v==null?t.objectStore('h').delete(k):t.objectStore('h').put(v,k);t.oncomplete=r;t.onerror=r})}catch(e){}}
async function perm(h,ask){if(!h)return '';try{const o={mode:'readwrite'};let s=await h.queryPermission(o);if(s!=='granted'&&ask)s=await h.requestPermission(o);return s}catch(e){return 'denied'}}

    catch(e){FS.err='تعذّر الحفظ في ملف قاعدة البيانات. تأكد من وجود ذاكرة الفلاش أو المجلد، أو اختر مكانًا آخر.';FS.dbPerm=await perm(FS.db,false)}

async function backupNow(manual){
  if(!FS.bk||FS.bkPerm!=='granted'){if(manual){FS.err='اختر مجلد النسخ الاحتياطية أولًا.';render()}return false}
  try{
    const d=new Date(),name='ADC-نسخة-احتياطية-'+today()+'_'+pad(d.getHours())+'-'+pad(d.getMinutes())+'.adcdb';
    const p=JSON.parse(dbPayload());p.receipts=await collectRawReceipts();
    const fh=await FS.bk.getFileHandle(name,{create:true});await writeHandle(fh,JSON.stringify(p));
    FS.bkSaved=Date.now();lsSet(LS_LASTBK,{at:FS.bkSaved,day:today()});FS.err='';if(manual){SEC.note='تم إنشاء نسخة احتياطية: '+name;render()}return true;

async function openDbFile(){

    const d=JSON.parse(await (await h.getFile()).text());
    if(d.app!=='ADC-site-accounts-db'||!d.auth||!d.vault)throw 0;
    lsSet(LS_AUTH,d.auth);lsSet(LS_VAULT,d.vault);lsSet(LS_META,{savedAt:d.savedAt||Date.now()});

const XLSX_R=(()=>{

  }

        const i=colIdx(c.getAttribute('r'));if(i<0)continue;const t=c.getAttribute('t');const vEl=c.getElementsByTagName('v')[0];let val=vEl?vEl.textContent:'';
        if(t==='s')val=ss[+val]??'';else if(t==='inlineStr'){val='';for(const x of c.getElementsByTagName('t'))val+=x.textContent}else if(t==='b')val=val==='1'?'TRUE':'FALSE';else if(t!=='str'&&val!==''&&!isNaN(+val))val=+val;

function buildImport(){
  const I=S.imp;if(!I||!I.rows)return;
  const m=I.map,site=I.siteId,rows=I.rows.slice(I.headerRow+1);
  const sig=r=>[r.date,Math.round(amt(r)*100),(r.notes||'').trim(),(r.contractor||'').trim()].join('|');
  const existing=new Set([...S.exp,...S.dep].filter(x=>x.siteId===site).map(sig));
  const seen=new Set();const out=[];
  rows.forEach((row,i)=>{
    const g=k=>m[k]!==undefined&&m[k]!==''?row[m[k]]:'';
    if(!row.some(c=>String(c??'').trim()!==''))return;
    let kind='exp',amount=NaN;
    const vin=parseAmount(g('in')),vout=parseAmount(g('out'));

}

async function printReport(kind){
  const html=reportDoc(kind);if(!html)return;
  if(OFF||APP){
    let fr=document.getElementById('printFrame');if(fr)fr.remove();
    fr=document.createElement('iframe');fr.id='printFrame';fr.setAttribute('aria-hidden','true');
    fr.style.cssText='position:fixed;width:0;height:0;border:0;left:-9999px';
    fr.srcdoc=html.replace(/<script>window\.addEventListener[\s\S]*?<\/script>/,'');
    fr.onload=()=>{try{fr.contentWindow.focus();fr.contentWindow.print()}catch(e){showBanner('تعذّرت الطباعة من هذا المتصفح. جرّب Chrome أو Edge.')}};
    document.body.appendChild(fr);return;
  }
  if(!S.downloads){showBanner('حفظ الملفات غير متاح في هذا العرض، لذا فالطباعة غير متاحة هنا.');return}
  const name={summary:'ملخص-المواقع',site:'كشف-حساب-'+siteNameOf(S.sel),journal:'دفتر-اليومية',stmt:S.stmt?(REG[S.stmt.col].stmt+'-'+S.stmt.name):''}[kind]||'تقرير';
  try{await S.downloads.save({filename:('ADC-'+name+'-'+today()+'.html').replace(/[\\/:*?"<>|]/g,'-'),data:new Blob([html],{type:'text/html'})});
    S.printMsg='تم حفظ ملف الطباعة. افتحه، وستُفتح نافذة الطباعة تلقائيًا: اختر الطابعة، أو «Save as PDF» لحفظه بصيغة PDF.';render()}catch(e){}
}

const KEEP=['r_name','r_spec','r_phone','r_claim','r_item','r_code','r_desc','e_contractor_new','e_item_new','j_contractor_new','j_item_new','j_site','j_amount','j_date','j_method','j_notes','j_item','j_contractor','j_remarks','e_amount','e_date','e_contractor','e_item','e_method','e_notes','e_remarks','k_date','k_cash','k_bank','k_notes'];
function render(){
  statusRender();renderSites();
  if(!S.loaded){$('#pane').innerHTML='<div class="blank"><h3>جاري تحميل الحسابات…</h3></div>';return}
  const keep={};const focusId=document.activeElement&&document.activeElement.id;
  if(!S.justSaved)for(const id of KEEP){const el=document.getElementById(id);if(el)keep[id]=el.value}
  S.justSaved=false;
  {const L=document.querySelector('.layout');if(L)L.classList.toggle('wide',S.sel==='__journal')}
  S.sel==='__all'?renderOverview():S.sel==='__journal'?renderJournal():S.sel==='__contractors'?renderRegister('contractors'):S.sel==='__items'?renderRegister('items'):S.sel==='__settings'?renderSettings():renderSite();
  const bar=excelBar();if(bar)$('#pane').insertAdjacentHTML('afterbegin',bar);
  if(S.printMsg){S.pflash={text:S.printMsg,until:Date.now()+10000};S.printMsg=''}
  if(S.pflash&&S.pflash.until>Date.now())$('#pane').insertAdjacentHTML('afterbegin',`<div class="xbar ok"><span>${esc(S.pflash.text)}</span></div>`);
  if(S.viewer)$('#pane').insertAdjacentHTML('beforeend',viewerHTML());
  for(const id in keep){const el=document.getElementById(id);if(el)el.value=keep[id]}

document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.viewer){S.viewer=null;render()}});
document.addEventListener('click',ev=>{
  const sb=ev.target.closest('[data-site]');
  if(sb){S.imp=null;if(sb.dataset.site==='__journal')S.jKeep.type='exp';S.stmt=null;S.regEdit=null;S.sf={site:'',from:'',to:''};S.confirmReg='';S.editing=null;S.pickedFile=null;S.flash=null;S.cflash=null;S.sel=sb.dataset.site;S.filt={c:'',i:'',from:'',to:'',q:''};S.confirmDel=null;S.confirmSite=false;S.note='';S.justSaved=true;render();window.scrollTo({top:0});return}

  const rd=ev.target.closest('[data-regdel]');if(rd){S.confirmReg=rd.dataset.regdel+'|'+rd.dataset.name;render();return}
  if(ev.target.closest('[data-regdelno]')){S.confirmReg='';render();return}
  const ry=ev.target.closest('[data-regdelyes]');if(ry){const col=ry.dataset.regdelyes,R=REG[col],r=(S[R.key]||[]).find(x=>x.name.trim()===ry.dataset.name&&!x.hidden);
    if(r&&canEditRec(r)){queue(col,r.id,{...clean(r),hidden:true,updated:Date.now()});logChange('delete',col,{name:r.name})}S.confirmReg='';render();return}
  const pb=ev.target.closest('[data-print]');if(pb){printReport(pb.dataset.print);return}
  if(ev.target.closest('[data-xlsx]')){exportExcel(null);return}
  const eb=ev.target.closest('[data-edit]');
  if(eb){const [col,id]=eb.dataset.edit.split(':');const r=(S[COLS[col]]||[]).find(x=>x.id===id);if(!r||!canEditRec(r))return;
    if(S.sel!==r.siteId){S.sel=r.siteId;S.filt={c:'',i:'',from:'',to:'',q:''}}
    S.editing={col,id,siteId:r.siteId};S.kind=col==='expenses'?'exp':'dep';S.fillEdit=true;S.confirmDel=null;S.justSaved=true;render();
    const c=$('#entryCard');if(c)c.scrollIntoView({behavior:'smooth',block:'start'});const a=$('#e_amount');if(a)a.focus({preventScroll:true});return}
  const rb=ev.target.closest('[data-receipt]');if(rb){const v={id:rb.dataset.receipt,type:rb.dataset.rtype};S.viewer=v;render();
    if(APP)appBlobUrl(v.id).then(u=>{if(S.viewer!==v)return;if(u)v.url=u;else v.missing=true;render()});
    if(OFF)rcGet(v.id).then(b=>{if(S.viewer!==v)return;if(b){v.url=URL.createObjectURL(b);v.type=b.type||v.type}else v.missing=true;render()}).catch(()=>{if(S.viewer===v){v.missing=true;render()}});return}
  if(ev.target.closest('#closeViewer')||ev.target.id==='viewer'){if(S.viewer&&S.viewer.url&&OFF)URL.revokeObjectURL(S.viewer.url);S.viewer=null;render();return}
  const k=ev.target.closest('[data-kind]');if(k){S.kind=k.dataset.kind;S.editing=null;render();return}
  const t=ev.target.closest('[data-tab]');if(t){S.tab=t.dataset.tab;S.confirmDel=null;render();return}
  const d=ev.target.closest('[data-del]');if(d){S.confirmDel=d.dataset.del;render();return}

  const y=ev.target.closest('[data-delyes]');
  if(y){const [col,id]=y.dataset.delyes.split(':');removeDoc(col,id).then(ok=>{if(ok){S.confirmDel=null;render()}})}
});
$('#newSiteForm').addEventListener('submit',ev=>{
  ev.preventDefault();

(async function start(){
  try{if(location.hash==='#journal')S.sel='__journal'}catch(e){}
  if(OFF){
    S.downloads=true;S.loaded=false;
    SEC.mode='';SEC.locked=true;if(!(auth()||{}).users)SEC.lastUser=MAIN_USER;
    if(!window.crypto||!crypto.subtle){showBanner('هذا المتصفح لا يدعم التشفير. افتح الملف بـ Chrome أو Edge.')}
    render();showLock();
    try{localStorage.setItem('adc_probe','1');localStorage.removeItem('adc_probe')}catch(e){showBanner('هذا المتصفح لا يسمح بحفظ البيانات في الملف. افتحه بـ Chrome أو Edge.')}
    return;
  }
  if(APP){await appBoot()}else{SEC.locked=true;showLock()}
  window.addEventListener('online',()=>flush());
  setInterval(()=>{if(S.pending.length)flush()},30000);
  const cache=lsGet(LS_CACHE);
  S.pending=lsGet(LS_PEND)||[];
  if(cache&&Array.isArray(cache.sites)){S.srv={sites:cache.sites,exp:cache.exp||[],dep:cache.dep||[],cnt:cache.cnt||[],log:cache.log||[],cons:cache.cons||[],items:cache.items||[]};S.cacheAt=cache.at;S.loaded=true}
  if(S.pending.length)S.loaded=true;
  merge();render();
  const db=await claude.use('db');
  if(!db){S.mode='off';S.loaded=true;render();return}
  S.db=db;
  setTimeout(()=>{if(S.mode==='loading'){S.mode='off';S.loaded=true;render()}},10000);
  claude.use('downloads').then(d=>{S.downloads=d;render()});
  claude.use('assets').then(a=>{S.assets=a;render()});
  const KEYS={sites:'sites',expenses:'exp',deposits:'dep',counts:'cnt',log:'log',contractors:'cons',items:'items'};
  const rebuild=()=>{for(const k of Object.values(KEYS)){const out=[];for(const pf in S.parts){for(const x of (S.parts[pf][k]||[]))out.push({...x,_p:pf})}if(k==='sites')out.sort((a,b)=>(a.created||0)-(b.created||0));S.srv[k]=out}};
  let need=0,got=0;
  const onErr=()=>{S.mode='off';S.loaded=true;render()};
  const onData=()=>{rebuild();merge();if(got>=need&&need>0){S.mode='live';S.loaded=true;saveCache();flush()}render()};
  const subCol=(pf,col,initial)=>{const key=pf+col;if(S.subbed.has(key))return;S.subbed.add(key);if(initial)need++;let first=true;
    let q=db.collection(pf+col);q=col==='log'?q.orderBy('at','desc').limit(1000):q.limit(1000);
    q.onSnapshot(snap=>{(S.parts[pf]=S.parts[pf]||{})[KEYS[col]]=snap.docs.map(d=>({id:d.id,...d.data()}));if(first&&!snap.metadata.fromCache){first=false;if(initial)got++}onData()},onErr)};
  const subAll=(pf,initial)=>{for(const c of Object.keys(KEYS))subCol(pf,c,initial)};
  const u=await claude.use('user');
  if(u){S.user=u;
    try{const [w,own,id,nm]=await Promise.all([u.can('data.write'),u.isOwner(),u.id(),u.name()]);
      if(w===false)S.canWrite=false;S.isManager=!!own;S.uid=id||null;S.myName=nm||'';if(id&&nm)S.names[id]=nm}catch(e){}
  }
  S.roleKnown=true;
  if(S.isManager){
    S.pfx='';subAll('',true);
    need++;let firstU=true;
    db.collection('u').limit(200).onSnapshot(snap=>{for(const d of snap.docs)subAll('u/'+d.id+'/',false);if(firstU&&!snap.metadata.fromCache){firstU=false;got++}onData()},onErr);
  }else if(S.uid){
    S.pfx='u/'+S.uid+'/';
    try{const mk=db.doc('u/'+S.uid);const g=await mk.get();if(!g.exists&&S.canWrite)await mk.set({joined:Date.now()})}catch(e){}
    subAll(S.pfx,true);subCol('','contractors',true);subCol('','items',true);
  }else{S.pfx=null;S.mode='off';S.loaded=true;showBanner(APP?'تعذّر التعرف على حسابك. سجّل الخروج ثم سجّل الدخول مرة أخرى.':'تعذّر التعرف على حسابك. سجّل الدخول إلى claude.ai وافتح الرابط مرة أخرى.')}
  render();
})();
