name: cheque-reminders
# تذكير الشيكات الآجلة — كل يوم 9 صباحًا بتوقيت القاهرة، قبل الاستحقاق بيوم
on:
  schedule:
    - cron: '3 6 * * *'   # 9 صباحًا (التوقيت الصيفي)
    - cron: '3 7 * * *'   # 9 صباحًا (التوقيت الشتوي)
  workflow_dispatch:
    inputs:
      force:
        description: 'إرسال تذكير تجريبي الآن بالشيكات المستحقة خلال 7 أيام'
        type: boolean
        default: true
permissions:
  contents: read
concurrency: cheque-reminders
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install web-push
        working-directory: report
        run: npm install --no-save --no-audit --no-fund web-push@3 > /dev/null
      - name: Send reminders
        working-directory: report
        env:
          MODE: remind
          SUPABASE_URL: https://ifsupnuwtkyfyughcudi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: BKNaK9D7Sk2clJgKixBQMU91QNyezF2ISjV87OxsDIJ4JUalM5x_kgWxohsOBURijvqcVJmxgFU984ewAvxZ0FE
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: node send.mjs
